<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 22 · 한국어 + 긴 URL</title>
  <style>
    /*
    9주차 예제 22 — 한국어 + 긴 URL
    */
    p, li, td {
      word-break: keep-all;        /* 어절 중간에서 안 끊는다 */
      overflow-wrap: break-word;   /* 공백 없는 긴 URL만 예외로 꺾는다 */
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
