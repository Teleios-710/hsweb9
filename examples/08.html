<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 8 · ② 미디어 오브젝트 — 이미지 옆에 글</title>
  <style>
    /*
    9주차 예제 8 — ② 미디어 오브젝트 — 이미지 옆에 글
    */
    .media {
      display: flex;
      gap: 16px;
      align-items: flex-start;   /* 위쪽 정렬 */
    }
    .media img {
      flex: 0 0 80px;    /* 80px 고정 — 안 늘고 안 줄고 */
      border-radius: 50%;
    }
    .media .body { flex: 1; }   /* 나머지 전부 */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
