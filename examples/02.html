<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 2 · flex container 속성</title>
  <style>
    /*
    9주차 예제 2 — flex container 속성
    */
    .container {
      display: flex;

      flex-direction: row;         /* row | column | row-reverse | column-reverse */

      justify-content: center;     /* 주축 정렬
         flex-start   ■■■□□□□□□   왼쪽 몰기 (기본)
         center       □□□■■■□□□   가운데
         flex-end     □□□□□□■■■   오른쪽 몰기
         space-between ■□□■□□□□■  양끝 붙이고 사이 균등  ← 헤더에 많이 씀
         space-around  □■□□■□□■□  각자 좌우 균등
         space-evenly  □■□■□■□    간격 완전 균등 */

      align-items: center;         /* 교차축 정렬
         stretch(기본) | flex-start | center | flex-end | baseline */

      flex-wrap: wrap;             /* 넘치면 다음 줄로 (기본은 nowrap: 찌그러짐) */

      gap: 16px;                   /* 요소 사이 간격. margin보다 훨씬 편하다 */
      gap: 16px 24px;              /* 행 간격 열 간격 */
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
