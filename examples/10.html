<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 10 · Grid 켜기</title>
  <style>
    /*
    9주차 예제 10 — Grid 켜기
    */
    .grid {
      display: grid;
      grid-template-columns: 200px 1fr 200px;   /* 3열: 고정 · 남는 만큼 · 고정 */
      grid-template-rows: auto 1fr auto;        /* 3행 */
      gap: 16px;
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
