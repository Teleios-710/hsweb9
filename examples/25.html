<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 25 · 기본값과 지역 변수</title>
  <style>
    /*
    9주차 예제 25 — 기본값과 지역 변수
    */
    /* 변수가 없을 때 쓸 값을 함께 줄 수 있습니다 */
    color: var(--accent, #666);

    /* 특정 영역에서만 다른 값을 쓸 수도 있습니다 (상속됩니다) */
    .dark-section {
      --text: #f9fafb;      /* 이 안에서만 --text가 밝은 색 */
      color: var(--text);
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
