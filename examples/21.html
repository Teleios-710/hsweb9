<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 21 · 표 — CSS</title>
  <style>
    /*
    9주차 예제 21 — 표 — CSS
    */
    .table-scroll {
      overflow-x: auto;              /* 표만 가로로 스크롤 */
      -webkit-overflow-scrolling: touch;
    }
    .table-scroll table { min-width: 480px; }

    /* ⚠ body에 가로 스크롤이 생기게 두면 안 됩니다.
       넘치는 것은 그 요소 안에서만 스크롤되게 합니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
