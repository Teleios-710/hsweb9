<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 18 · 모바일 규칙이 죽는 순간</title>
  <style>
    /*
    9주차 예제 18 — 모바일 규칙이 죽는 순간
    */
    /* style.css 589번째 줄 */
    @media (max-width: 768px) {
      .pg-grid { grid-template-columns: 1fr; }
    }

    /* style.css 623번째 줄 */
    .pg-grid { grid-template-columns: repeat(2, 1fr); }   /* ← 이게 이깁니다 */

    /* 결과: 휴대폰에서도 2열 그대로.
       화면에는 "좁은 화면에서 안 접힌다"로만 보이고,
       빌드는 아무 오류 없이 통과합니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
