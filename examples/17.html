<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 17 · 두 가지 방향</title>
  <style>
    /*
    9주차 예제 17 — 두 가지 방향
    */
    /* 방식 ① 데스크톱 우선 — 기본은 넓은 화면, max-width로 줄여 감 */
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    /* 방식 ② 모바일 우선 — 기본은 좁은 화면, min-width로 넓혀 감 (권장) */
    .grid { grid-template-columns: 1fr; }
    @media (min-width: 769px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
