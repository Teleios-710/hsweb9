<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>9주차 예제 3 · 완벽한 가운데 정렬 — 세 줄이면 끝</title>
  <style>
    /*
    9주차 예제 3 — 완벽한 가운데 정렬 — 세 줄이면 끝
    */
    .center {
      display: flex;
      justify-content: center;   /* 가로 가운데 */
      align-items: center;       /* 세로 가운데 */
      height: 300px;
    }

    /* Flexbox 이전에는 이 간단한 것을 하려고
       온갖 편법을 써야 했습니다. 지금은 세 줄입니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
