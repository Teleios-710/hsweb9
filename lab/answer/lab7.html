<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 실습 7 모범답안</title>
  <style>
    /*
    실습 7 모범답안 — 스스로 해 본 뒤에 보세요
    */
    :root {
      --main: #4338ca;
      --text: #111827;
      --bg: #ffffff;
      --radius: 12px;
    }

    h1 { color: var(--main); }

    button {
      background: var(--main);
      color: #fff;
      border: 0;
      padding: 10px 20px;
      border-radius: var(--radius);
    }

    .card {
      background: var(--bg);
      color: var(--text);
      border-radius: var(--radius);
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
