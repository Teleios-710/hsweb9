<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 실습 6 모범답안</title>
  <style>
    /*
    실습 6 모범답안 — 스스로 해 본 뒤에 보세요
    */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    /* 반응형 규칙은 파일 뒤쪽에 — 앞에 두면 뒤 규칙에 덮여 죽습니다 */
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
